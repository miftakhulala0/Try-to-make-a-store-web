<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Toko Muria Barokah</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/icon-192.png">
    <link rel="apple-touch-icon" href="../assets/icon-192.png">
    <meta name="theme-color" content="#2b2723">
    <style>
        :root { 
            --primary: #c79f4b; 
            --primary-hover: #b38e3f; 
            --bg-dark: #2b2723;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1f1c1a; color: #f5f5f5; }
        
        /* HEADER */
        header { 
            background-color: var(--bg-dark); 
            padding: 15px 20px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            border-bottom: 1px solid rgba(199, 159, 75, 0.15);
        }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* BARIS BARU: Menyejajarkan Tombol Kembali dan Store Brand ke Samping */
        .top-nav-row {
            display: flex;
            align-items: center;
            gap: 20px; /* Jarak aman antara tombol dan nama brand */
            width: 100%;
        }

        /* Kontainer Tombol Kembali Kapsul */
        .back-container { 
            display: inline-block; 
        }
        .back-link { 
            text-decoration: none; 
            color: var(--primary); 
            background: #3a342e;
            border: 1px solid rgba(199, 159, 75, 0.25);
            font-size: 14px; 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 999px;
            transition: all .3s ease;
        }
        .back-link:hover { 
            color: #2b2723; 
            background: var(--primary);
            border-color: var(--primary);
            transform: translateX(-3px);
        }
        
        /* KEMBALI KE ASLI: Style Store Brand dengan penyesuaian warna */
        .store-brand { 
            font-size: 22px; 
            font-weight: bold; 
            color: #ffffff; /* Menggunakan warna putih agar kontras dan premium */
            letter-spacing: 0.5px;
        }

        /* Baris Pencarian dan Filter Bar */
        .search-filter-row {
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .search-container { 
            display: flex; 
            flex-grow: 1;
            border: 1px solid rgba(199, 159, 75, 0.2); 
            border-radius: 8px; 
            overflow: hidden; 
            transition: all 0.2s ease; 
            background: #3a342e; 
        }
        .search-container:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(199, 159, 75, 0.15); }
        .search-input { flex-grow: 1; padding: 12px 15px; border: none; font-size: 15px; outline: none; background: transparent; color: white; width: 100%; }
        .search-input::placeholder { color: #aaa; }
        
        .search-button { background-color: var(--primary); border: none; padding: 0 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.15s ease; }
        .search-button svg { fill: #1f1c1a; }
        .search-button:hover { background-color: var(--primary-hover); }
        
        /* Dropdown Filter di Samping Kanan Search Bar */
        .filter-dropdown {
            background: #3a342e;
            color: white;
            border: 1px solid rgba(199, 159, 75, 0.3);
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            outline: none;
            transition: .3s;
            min-width: 150px;
        }
        .filter-dropdown:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(199, 159, 75, 0.15);
        }
        
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { flex: 1; border: none; border-radius: 6px; padding: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 14px; transition: .3s; }
        #cart-btn { background: #3a342e; color: white; border: 1px solid rgba(199, 159, 75, 0.2); }
        #cart-btn:hover { background: #4a423b; border-color: var(--primary); }
        
        .main-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* GRID PRODUK (Desktop 4, Tablet 3, Mobile 2) */
        .grid-products { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 32px; 
        }
        
        .product-link { text-decoration: none; color: inherit; cursor: pointer; }
        
        .product-card { 
            background: rgba(45, 40, 35, 0.8); 
            border: 1px solid rgba(199, 159, 75, 0.15); 
            border-radius: 24px; 
            overflow: hidden; 
            transition: .3s; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            position: relative;
        }
        
        .product-card:hover { 
            transform: translateY(-8px); 
            border-color: rgba(199, 159, 75, 0.5); 
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); 
        }
        
        .category-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(43, 39, 35, 0.85);
            backdrop-filter: blur(8px);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(199, 159, 75, 0.25);
            z-index: 2;
        }
        
        /* Aspect Ratio Lanskap 1.414/1 dengan Object-Fit Cover */
        .product-img-wrapper { 
            width: 100%; 
            aspect-ratio: 1.414 / 1; 
            background-color: #3a342e; 
            overflow: hidden; 
        }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .product-title { 
            font-size: 1rem; 
            line-height: 1.5; 
            color: #fff;
            height: 48px; 
            overflow: hidden; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            margin-bottom: 12px; 
        }
        
        .product-price { 
            color: #c79f4b; 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-top: auto; 
        }
        
        .search-status-message { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #aaa; font-size: 16px; }
        .is-hidden { display: none !important; }
        
        /* Skeleton loading */
        .skeleton-card { background: rgba(45, 40, 35, 0.8); border-radius: 24px; overflow: hidden; border: 1px solid rgba(199, 159, 75, 0.15); }
        .skeleton-img { aspect-ratio: 1.414 / 1; background: #3a342e; animation: pulse 1.4s infinite; }
        .skeleton-body { padding: 20px; }
        .skeleton-line { height: 14px; border-radius: 999px; background: #3a342e; margin-bottom: 10px; animation: pulse 1.4s infinite; }
        .skeleton-line.short { width: 60%; }
        @keyframes pulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
        
        /* TOAST NOTIFICATION */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2b2723;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 99999;
            border: 1px solid rgba(199, 159, 75, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-weight: 500;
        }
        
        /* MODAL DETAIL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .hidden { display: none !important; }
        
        .modal-content { 
            background: #2b2723; 
            color: white;
            width: 100%; 
            max-width: 500px; 
            border-radius: 24px; 
            position: relative; 
            max-height: 90vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border: 1px solid rgba(199, 159, 75, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .close-modal { position: absolute; top: 15px; right: 15px; width: 40px; min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: rgba(58, 52, 46, 0.9); backdrop-filter: blur(5px); color: white; cursor: pointer; font-size: 20px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 100; transition: all 0.2s ease; }
        .close-modal:hover { transform: scale(1.05); background: #c79f4b; color: #2b2723; }
        .modal-scroll-body { overflow-y: auto; padding: 25px; width: 100%; height: 100%; }
        .modal-image { width: 100%; aspect-ratio: 1.414 / 1; object-fit: cover; border-radius: 14px; margin-bottom: 20px; display: block; }
        .modal-title { padding-right: 45px; margin-bottom: 10px; font-weight: 500; }
        .modal-price { font-size: 24px; font-weight: bold; margin: 10px 0; color: #c79f4b; }
        .modal-description { margin: 15px 0; color: #d7d7d7; }
        .modal-description p { margin-bottom: 12px; line-height: 1.6; }
        .modal-description ul { padding-left: 20px; margin-bottom: 12px; }
        .modal-description li { margin-bottom: 8px; line-height: 1.5; }
        
        .qty-container { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .qty-btn { width: 40px; height: 40px; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid rgba(199, 159, 75, 0.3); background: #3a342e; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .qty-btn:hover { background: #c79f4b; color: #2b2723; border-color: #c79f4b; }
        #modal-qty { font-size: 18px; font-weight: bold; min-width: 30px; text-align: center; }
        
        #buy-button-wrapper { width: 100%; margin-top: 10px; }
        .modal-buy-btn { display: block; width: 100%; text-align: center; background: #c79f4b; color: #1f1c1a; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: .3s; }
        .modal-buy-btn:hover { background: #b38e3f; transform: translateY(-2px); }
        
        /* MODAL KERANJANG */
        .cart-table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; }
        .cart-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .cart-table th { background: #3a342e; padding: 12px 10px; font-weight: bold; color: #c79f4b; border-bottom: 2px solid rgba(199, 159, 75, 0.2); }
        .cart-table td { padding: 14px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; color: #e5e5e5; }
        .cart-qty-control { display: flex; align-items: center; gap: 6px; }
        .cart-qty-btn { width: 26px; height: 26px; font-size: 14px; background: #3a342e; color: white; border: 1px solid rgba(199, 159, 75, 0.2); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .cart-qty-btn:hover { background: #c79f4b; color: #2b2723; }
        
        #order-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
            margin-top: 25px;
            text-align: center;
        }
        #order-btn:hover { background: #15803d; transform: translateY(-2px); }
        
        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 1024px) { 
            .grid-products { grid-template-columns: repeat(3, 1fr); gap: 24px; }
        }
        @media (max-width: 768px) {
            .grid-products { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .search-filter-row { flex-direction: column; gap: 10px; align-items: stretch; }
            .filter-dropdown { width: 100%; min-width: auto; }
            .main-container { margin: 20px auto; padding: 0 15px; } 
            .header-container { gap: 10px; } 
            .product-info { padding: 12px; }
            .product-title { font-size: 0.9rem; height: 42px; margin-bottom: 8px; }
            .product-price { font-size: 1rem; }
            .category-badge { font-size: 9px; padding: 3px 8px; top: 8px; left: 8px; }
            .store-brand { font-size: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            
            <div class="top-nav-row">
                <div class="back-container">
                    <a href="../index.html" class="back-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Kembali
                    </a>
                </div>
                <div class="store-brand">Toko Muria Barokah</div>
            </div>
            
            <div class="search-filter-row">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Cari produk...">
                    <button type="button" id="search-button" class="search-button">
                        <svg width="19" height="19" viewBox="0 0 19 19">
                            <path d="M8 16c4.42 0 8-3.58 8-8s-3.58-8-8-8-8 3.58-8 8 3.58 8 8 8zm0-2c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
                            <path d="M12.3 13.7l5 4.9c.39.4 1.03.4 1.42 0 .39-.4.39-1.03 0-1.42l-5-4.9c-.39-.4-1.03-.4-1.42 0-.39.4-.39 1.03 0 1.42z"/>
                        </svg>
                    </button>
                </div>
                <select id="filter-select" class="filter-dropdown">
                    <option value="Semua">Semua Kategori</option>
                </select>
            </div>
            
            <div class="action-buttons">
                <button id="cart-btn">🛒 Keranjang (0)</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div id="search-status" class="search-status-message is-hidden"></div>
        <div class="grid-products" id="product-grid"></div>
    </main>

    <div id="toast"></div>

    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">✕</button>
            <div class="modal-scroll-body">
                <img id="modal-image" class="modal-image" alt="Produk" onerror="this.onerror=null;this.src='../assets/noimage.webp';">
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-price" class="modal-price"></div>
                <div id="modal-description" class="modal-description"></div>      
                <div class="qty-container">
                    <button id="qty-minus" class="qty-btn">−</button>
                    <span id="modal-qty">1</span>
                    <button id="qty-plus" class="qty-btn">+</button>
                </div>
                <div id="buy-button-wrapper"></div>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 650px; width: 95%;">
            <button id="close-cart-modal" class="close-modal">✕</button>
            <div class="modal-scroll-body" style="padding: 25px;">
                <h2 style="font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #c79f4b;">Keranjang Belanja</h2>
                <div class="cart-table-wrapper">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th style="width: 8%">No</th>
                                <th style="width: 37%">Nama</th>
                                <th style="width: 20%">Harga</th>
                                <th style="width: 15%">Jumlah</th>
                                <th style="width: 20%">Total</th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-items"></tbody>
                    </table>
                </div>
                <hr style="margin:20px 0; border: none; border-top: 1px solid rgba(199, 159, 75, 0.2);">
                <h3 style="font-size: 18px; font-weight: bold; color: white; display: flex; justify-content: space-between;">
                    <span>Total Pembayaran:</span> <span id="cart-total" style="color:#c79f4b;">Rp 0</span>
                </h3>
                <button id="order-btn">Pesan via WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const $ = id => document.getElementById(id);
            const SHEET_URL = "https://opensheet.elk.sh/15ZPzJDFRCxmnEzd-XlYdzBEa-DUY4fQT-Fni3ETOzZc/Daftar Produk";
            const fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });
            
            let rawProductsData = [];
            let cart = []; 
            let modalQty = 1;
            let currentSelectedCategory = 'Semua';

            function showToast(message){
                const toast = $('toast');
                toast.textContent = message;
                toast.style.opacity = '1';
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            }

            const showSkeleton = (count = 8) => {
                $('product-grid').innerHTML = `
                    <div class="skeleton-card">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                    </div>`.repeat(count);
            };

            async function loadProducts() {
                try {
                    $('search-status').classList.add('is-hidden');
                    showSkeleton();
                    const res = await fetch(SHEET_URL);
                    const data = await res.json();
                    localStorage.setItem("cachedProducts", JSON.stringify(data));
                    processProductsData(data);
                } catch (err) {
                    console.error(err);
                    const cached = localStorage.getItem("cachedProducts");
                    if (cached) {
                        processProductsData(JSON.parse(cached));
                        return;
                    }
                    $('search-status').textContent = 'Tidak ada koneksi internet';
                    $('search-status').classList.remove('is-hidden');
                    $('product-grid').innerHTML = '';
                }
            }

            function processProductsData(data) {
                rawProductsData = data
                    .filter(item => item.status?.toLowerCase().trim() === 'aktif')
                    .map(item => [
                        item.id || '', item.nama || '', Number(item.harga) || 0,
                        item.gambar || '', item.link || '#', item.kategori || 'Lainnya', item.deskripsi || ''
                    ]);
                
                generateFilterDropdown();
                renderCatalog();
                $('search-input').focus();
            }

            function generateFilterDropdown() {
                const categories = rawProductsData.map(item => item[5].trim());
                const uniqueCategories = ['Semua', ...new Set(categories)];
                
                const selectEl = $('filter-select');
                selectEl.innerHTML = uniqueCategories.map(cat => {
                    return `<option value="${cat}">${cat === 'Semua' ? 'Semua Kategori' : cat}</option>`;
                }).join('');

                selectEl.addEventListener('change', (e) => {
                    currentSelectedCategory = e.target.value;
                    renderCatalog($('search-input').value);
                });
            }

            function renderCatalog(keyword = '') {
                $('product-grid').innerHTML = '';
                const cleanKeyword = keyword.toLowerCase().trim();
                
                const filtered = rawProductsData.filter(item => {
                    const matchKeyword = item[1].toLowerCase().includes(cleanKeyword);
                    const matchCategory = (currentSelectedCategory === 'Semua' || item[5] === currentSelectedCategory);
                    return matchKeyword && matchCategory;
                });

                if (!filtered.length) {
                    $('search-status').textContent = 'Maaf, produk tidak ditemukan 🔎';
                    $('search-status').classList.remove('is-hidden');
                    return;
                }
                
                $('search-status').classList.add('is-hidden');
                
                filtered.forEach(item => {
                    const [id, title, price, imgUrl, targetLink, category, description] = item;
                    const card = document.createElement('div');
                    card.className = 'product-link';
                    
                    card.innerHTML = `
                        <article class="product-card">
                            <div class="category-badge">${category}</div>
                            <div class="product-img-wrapper">
                                <img src="${imgUrl || '../assets/noimage.webp'}" alt="${title}" onerror="this.onerror=null;this.src='../assets/noimage.webp';">
                            </div>
                            <div class="product-info">
                                <div class="product-title">${title}</div>
                                <div class="product-price">${fmt.format(price)}</div>
                            </div>
                        </article>`;
                    
                    card.addEventListener('click', () => {
                        $('modal-title').textContent = title;
                        $('modal-price').textContent = fmt.format(price);
                        $('modal-image').src = imgUrl || '../assets/noimage.webp';
                        modalQty = 1;
                        $('modal-qty').textContent = modalQty;
                        
                        const container = $('modal-description');
                        container.innerHTML = '';
                        let ul = null;
                        description.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
                            if (line.startsWith('-')) {
                                if (!ul) container.appendChild(ul = document.createElement('ul'));
                                const li = document.createElement('li');
                                li.innerHTML = line.replace('-', '').trim();
                                ul.appendChild(li);
                            } else {
                                ul = null;
                                const p = document.createElement('p');
                                p.innerHTML = line;
                                container.appendChild(p);
                            }
                        });
                        
                        const wrapper = $('buy-button-wrapper');
                        wrapper.innerHTML = '';
                        const newBuyBtn = document.createElement('button');
                        newBuyBtn.type = 'button';
                        newBuyBtn.className = 'modal-buy-btn';
                        newBuyBtn.textContent = 'Tambah ke Keranjang';
                        
                        newBuyBtn.addEventListener('click', () => {
                            const existing = cart.find(cartItem => cartItem.title === title);
                            if (existing) {
                                existing.qty += modalQty;
                            } else {
                                cart.push({ id: id || title, title: title, price: Number(price), qty: modalQty });
                            }
                            updateCartUI();
                            $('product-modal').classList.add('hidden');
                            showToast('✓ Ditambahkan ke Keranjang');
                        });
                        
                        wrapper.appendChild(newBuyBtn);
                        $('product-modal').classList.remove('hidden');
                        document.querySelector('.modal-scroll-body').scrollTop = 0;
                    });
                    $('product-grid').appendChild(card);
                });
            }

            $('qty-minus').addEventListener('click', () => {
                if (modalQty > 1) { modalQty--; $('modal-qty').textContent = modalQty; }
            });
            $('qty-plus').addEventListener('click', () => {
                modalQty++; $('modal-qty').textContent = modalQty;
            });

            function updateCartUI() {
                $('cart-btn').textContent = `🛒 Keranjang (${cart.reduce((a, b) => a + b.qty, 0)})`;
                renderCartTable();
            }

            function renderCartTable() {
                const container = $('cart-table-items');
                container.innerHTML = "";
                if (cart.length === 0) {
                    container.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#aaa; padding:20px 0;">Keranjang kosong</td></tr>`;
                    $('cart-total').textContent = "Rp 0";
                    return;
                }
                let grandTotal = 0;
                cart.forEach((item, index) => {
                    const subtotal = item.price * item.qty;
                    grandTotal += subtotal;
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td style="font-weight:600; color:white;">${item.title}</td>
                        <td>${fmt.format(item.price)}</td>
                        <td>
                            <div class="cart-qty-control">
                                <button onclick="changeQtyByTitle('${item.title.replace(/'/g, "\\'")}',-1)" class="cart-qty-btn">−</button>
                                <span style="font-weight:bold; min-width:15px; text-align:center;">${item.qty}</span>
                                <button onclick="changeQtyByTitle('${item.title.replace(/'/g, "\\'")}',1)" class="cart-qty-btn">+</button>
                            </div>
                        </td>
                        <td style="font-weight:bold; color:#c79f4b;">${fmt.format(subtotal)}</td>
                    `;
                    container.appendChild(tr);
                });
                $('cart-total').textContent = fmt.format(grandTotal);
            }

            window.changeQtyByTitle = function(title, delta) {
                const item = cart.find(i => i.title === title);
                if (!item) return;
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.title !== title);
                }
                updateCartUI();
            }

            function sendWhatsAppOrder() {
                if (cart.length === 0) {
                    alert("Keranjang belanja Anda masih kosong.");
                    return;
                }

                let pesan = "Hai Toko Muria Barokah,\n\n";
                pesan += "Saya ingin memesan produk berikut:\n\n";
                pesan += "No | Nama | Harga | Qty | Total\n\n";

                let grandTotal = 0;
                cart.forEach((item, index) => {
                    const totalItem = item.price * item.qty;
                    grandTotal += totalItem;
                    pesan += `${index + 1} | ${item.title} | ${fmt.format(item.price)} | ${item.qty} | ${fmt.format(totalItem)}\n`;
                });

                pesan += `\nTOTAL:\n${fmt.format(grandTotal)}\n\n`;
                pesan += "Nama Pemesan:\n..........................\n\n";
                pesan += "Rencana Pengambilan:\n..........................\n\n";
                pesan += "Terima kasih.";

                const nomorWA = "6281326242174";
                window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`, '_blank');
            }

            $('order-btn').addEventListener('click', sendWhatsAppOrder);

            let debounceTimer;
            $('search-input').addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => renderCatalog($('search-input').value), 250);
            });
            
            $('search-button').addEventListener('click', () => renderCatalog($('search-input').value));
            $('search-input').addEventListener('keypress', e => e.key === 'Enter' && renderCatalog($('search-input').value));
            $('close-modal').addEventListener('click', () => $('product-modal').classList.add('hidden'));
            $('product-modal').addEventListener('click', e => e.target.id === 'product-modal' && $('product-modal').classList.add('hidden'));
            
            $('cart-btn').addEventListener('click', () => {
                renderCartTable();
                $('cart-modal').classList.remove('hidden');
            });
            $('close-cart-modal').addEventListener('click', () => { $('cart-modal').classList.add('hidden'); });
            $('cart-modal').addEventListener('click', e => { if (e.target.id === 'cart-modal') $('cart-modal').classList.add('hidden'); });
            
            loadProducts();
            updateCartUI();
        })();
    </script>
</body>
</html>
